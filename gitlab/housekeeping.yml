lint_frontend:
  stage: housekeeping
  image: node:22
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  script:
    - npm ci
    - npx eslint "src/**/*.{js,vue}"

deps_check:
  stage: housekeeping
  image: node:22
  allow_failure: true
  rules:
    - when: always
  script:
    - npm ci --prefer-offline 2>/dev/null || npm ci
    - npm audit --audit-level=high
