workflow:
  rules:
    - if: '$GITLAB_CI == "false"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

default:
  interruptible: true
  tags:
    - test

stages:
  - housekeeping

include:
  - local: 'gitlab/housekeeping.yml'
